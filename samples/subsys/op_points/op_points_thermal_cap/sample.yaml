sample:
  description: Operating Points sample
  name: Operating Points Sample
common:
  tags:
    - op_points
    - pm
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "^Op-Points/Thermal-Cap sample$"
      - '^die temperature: \d+\.\d+ C, thermal cap: \w+$'
      - "^Setting op-point: nominal$"
      - "^Setting op-point: performance$"
      - "^Clearing op-point$"

tests:
  sample.sample.op_points.op_points_thermal_cap:
    platform_allow:
      - frdm_mcxn236
    integration_platforms:
      - frdm_mcxn236
