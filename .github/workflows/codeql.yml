name: "CodeQL"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
            config: ./.github/codeql/codeql-actions-config.yml
          - language: javascript-typescript
            build-mode: none
            config: ./.github/codeql/codeql-js-config.yml
    steps:
      - name: Remove Possible Existing Access Token
        continue-on-error: true
        run: |
          # Token is generated at the run time and at the end of process it is expires,
          # storing it in global config causes duplication line in config file
          # so that possible existing one shall be deleted before generating new one
          # otherwiser autantication will be failed.
          existingTokenURL=$(git config --global --get-regexp url.*@github.com/.insteadOf)
          echo "All Token:${existingTokenURL}"
          for item in $(echo ${existingTokenURL}); do
            if [ ${item} == "https://github.com/" ]; then
              continue
            fi
            echo "Removing: ${item}"
            git config --global --unset-all "${item}"
          done

      - name: Get Access Token
        id: generate-github-app-token
        uses: adi-innersource/shared-actions/generate-github-token@45fc4e63b0e877e3fc9af0f03153d6fb89ac700d # generate-github-token-v1.0.2
        with:
          app-id: ${{ secrets.TOKEN_GENERATOR_APP_ID }}
          private-key: ${{ secrets.TOKEN_GENERATOR_APP_PRIVATE_KEY }}
          organization: ${{ github.repository_owner }}
          repositories: |
            zephyr
            zephyr-runner-configurations
            hal_adi
            packetcraft-adi
            trusted-firmware-m
            trusted-firmware-a
            tf-m-tests
            psa-arch-tests

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.generate-github-app-token.outputs.access-token }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ${{ matrix.config }}

      - if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo "nothing yet"
          exit 0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{matrix.language}}"
          token: ${{ steps.generate-github-app-token.outputs.access-token }}
