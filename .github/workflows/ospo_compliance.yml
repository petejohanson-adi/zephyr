name: ADI Zephyr Innersource Policy Compliance Scan

on:
  workflow_dispatch:
  push:
    branches:
      - adi-main
      - release*

permissions:
  contents: write
  id-token: write

env:
  COMPLIANCE_PROJECT_NAME: "zephyr-innersource"

jobs:
  policy-compliance-scan:
    runs-on: ses-ist-build-lu-x64-adi-zephyr-sdk
    container: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.28.6.20251003
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Get Branch
        run: echo "GITHUB_BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Install Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: "adopt"
          java-version: "17"

      - name: Policy Scan Action
        uses: adi-innersource/shared-actions/policy-scan@4dac263c82bf24627a1b1e2e513e0511d8b4f934 # policy-scan-v3
        env:
          BLACKDUCK_AUTH_TOKEN: ${{ secrets.BLACKDUCK_AUTH_TOKEN }}
          CLOUDSMITH_OSPO_USER: ${{ secrets.CLOUDSMITH_OSPO_USER }}
        with:
          component-name: ${{ env.COMPLIANCE_PROJECT_NAME }}
          component-version: ${{ env.GITHUB_BRANCH_NAME }}
          blackduck-options: |
            --detect.excluded.detector.types=GIT,PIP
            --detect.policy.check.fail.on.severities=NONE
            --detect.wait.for.results=false

  ospo_collateral:
    runs-on: ses-ist-build-lu-x64-adi-zephyr-sdk
    needs: policy-compliance-scan
    steps:
      - name: Get Branch
        run: echo "GITHUB_BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: OSPO Collateral
        id: ospo_collateral
        uses: adi-innersource/shared-actions/policy-collateral@069f4c7d54d6aabcfaf7728378e5cef50f378188 # policy-collateral-v2.5.0
        env:
          BLACKDUCK_AUTH_TOKEN: ${{ secrets.BLACKDUCK_AUTH_TOKEN }}
          AWS_REGION: ${{ secrets.PROD_LICENSE_AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.PROD_LICENSE_AWS_BUCKET_NAME }}
          AWS_DEPLOY_ROLE: ${{ secrets.PROD_AWS_DEPLOY_ROLE }}
          CLOUDSMITH_OSPO_USER: ${{ secrets.CLOUDSMITH_OSPO_USER }}
        with:
          component-name: ${{ env.COMPLIANCE_PROJECT_NAME }}
          component-version: ${{ env.GITHUB_BRANCH_NAME }}
