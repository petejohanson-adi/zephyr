name: Manifest
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  contribs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write # to create/update pull request comments
    name: Manifest
    steps:
      - name: Remove Possible Existing Access Token
        continue-on-error: true
        run: |
          # Token is generated at the run time and at the end of process it is expires,
          # storing it in global config causes duplication line in config file
          # so that possible existing one shall be deleted before generating new one
          # otherwiser autantication will be failed.
          existingTokenURL=$(git config --global --get-regexp url.*@github.com/.insteadOf)
          echo "All Token:${existingTokenURL}"
          for item in $(echo ${existingTokenURL}); do
            if [ ${item} == "https://github.com/" ]; then
              continue
            fi
            echo "Removing: ${item}"
            git config --global --unset-all "${item}"
          done

      - name: Get Access Token
        id: generate-github-app-token
        uses: adi-innersource/shared-actions/generate-github-token@45fc4e63b0e877e3fc9af0f03153d6fb89ac700d # generate-github-token-v1.0.2
        with:
          app-id: ${{ secrets.TOKEN_GENERATOR_APP_ID }}
          private-key: ${{ secrets.TOKEN_GENERATOR_APP_PRIVATE_KEY }}
          organization: ${{ github.repository_owner }}
          repositories: |
            zephyr
            zephyr-runner-configurations
            hal_adi
            packetcraft-adi
            trusted-firmware-m
            trusted-firmware-a
            tf-m-tests
            psa-arch-tests

      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate-github-app-token.outputs.access-token }}
          path: zephyrproject/zephyr
          fetch-depth: 0
          persist-credentials: false

      - name: west setup
        env:
          BASE_REF: ${{ github.base_ref }}
          ACCESS_TOKEN: ${{ steps.generate-github-app-token.outputs.access-token }}
        working-directory: zephyrproject/zephyr
        run: |
          pip install -r scripts/requirements-west.txt --require-hashes
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          git config --global url."https://${ACCESS_TOKEN}:${ACCESS_TOKEN}@github.com/".insteadOf "https://github.com/"
          west init -l . || true
          # Remove token that used by this session
          git config --global --unset-all url."https://${ACCESS_TOKEN}:${ACCESS_TOKEN}@github.com/".insteadOf

      - name: Manifest
        uses: zephyrproject-rtos/action-manifest@854c72013232bc7a3c437de93ba608d91212b010
        with:
          github-token: ${{ steps.generate-github-app-token.outputs.access-token }}
          manifest-path: 'west.yml'
          checkout-path: 'zephyrproject/zephyr'
          use-tree-checkout: 'true'
          check-impostor-commits: 'true'
          label-prefix: 'manifest-'
          verbosity-level: '1'
          labels: 'manifest'
          dnm-labels: 'DNM (manifest)'
          blobs-added-labels: 'Binary Blobs Added'
          blobs-modified-labels: 'Binary Blobs Modified'
