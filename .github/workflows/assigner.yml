name: Pull Request/Issue Assigner

on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    branches:
    - main
    - adi-main*
    - collab-*
    - v*-branch
  issues:
    types:
    - labeled

permissions:
  contents: read

jobs:
  assignment:
    name: Pull Request/Issue Assignment
    if: github.event.pull_request.draft == false
    runs-on: arc
    timeout-minutes: 15
    permissions:
      issues: write        # to add assignees to issues
      pull-requests: write # posting comments when new users being added.

    steps:
    - name: Remove Possible Existing Access Token
      continue-on-error: true
      run: |
        # Token is generated at the run time and at the end of process it is expires,
        # storing it in global config causes duplication line in config file
        # so that possible existing one shall be deleted before generating new one
        # otherwiser autantication will be failed.
        existingTokenURL=$(git config --global --get-regexp url.*@github.com/.insteadOf)
        echo "All Token:${existingTokenURL}"
        for item in $(echo ${existingTokenURL}); do
          if [ ${item} == "https://github.com/" ]; then
            continue
          fi
          echo "Removing: ${item}"
          git config --global --unset-all "${item}"
        done

    - name: Get Access Token
      id: generate-github-app-token
      uses: adi-innersource/shared-actions/generate-github-token@45fc4e63b0e877e3fc9af0f03153d6fb89ac700d # generate-github-token-v1.0.2
      with:
        app-id: ${{ secrets.TOKEN_GENERATOR_APP_ID }}
        private-key: ${{ secrets.TOKEN_GENERATOR_APP_PRIVATE_KEY }}
        organization: ${{ github.repository_owner }}
        repositories: |
          zephyr
          zephyr-runner-configurations
          hal_adi
          packetcraft-adi
          trusted-firmware-m
          trusted-firmware-a
          tf-m-tests
          psa-arch-tests

    - name: Check out source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
        token: ${{ steps.generate-github-app-token.outputs.access-token }}

    - name: Set up Python
      uses: zephyrproject-rtos/action-python-env@ce8c0c1fe59d56df1c9812d975a6e78d9c51192c # main
      with:
        python-version: 3.12

    - name: Fetch west.yml/Maintainer.yml from pull request
      if: >
        github.event_name == 'pull_request_target' && github.base_ref == 'main'
      run: |
        git fetch origin pull/${{ github.event.pull_request.number }}/merge
        # FETCH_HEAD is the PR merge commit; its first parent (FETCH_HEAD^1) is
        # the base the merge was computed from. Diffing the PR version against
        # that base (rather than the moving base-branch tip) isolates exactly
        # the changes the PR introduces (see #110422).
        git show FETCH_HEAD:west.yml > pr_west.yml
        git show FETCH_HEAD^1:west.yml > base_west.yml
        git show FETCH_HEAD:MAINTAINERS.yml > pr_MAINTAINERS.yml
        git show FETCH_HEAD^1:MAINTAINERS.yml > base_MAINTAINERS.yml

    - name: west setup
      if: >
        github.event_name == 'pull_request_target'
      run: |
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
        west init -l . || true

    - name: Run assignment script
      env:
        GITHUB_TOKEN: ${{ steps.generate-github-app-token.outputs.access-token }}
      run: |
        FLAGS="-v"
        FLAGS+=" -o ${{ github.event.repository.owner.login }}"
        FLAGS+=" -r ${{ github.event.repository.name }}"
        FLAGS+=" -M ADI-MAINTAINERS.yml"
        if [ "${{ github.event_name }}" = "pull_request_target" ]; then
          if [ "${{ github.base_ref }}" = "main" ]; then
            FLAGS+=" -P ${{ github.event.pull_request.number }}"
            FLAGS+=" --updated-manifest pr_west.yml --base-manifest base_west.yml"
            FLAGS+=" --updated-maintainer-file pr_MAINTAINERS.yml"
            FLAGS+=" --base-maintainer-file base_MAINTAINERS.yml"
          else
            FLAGS+=" -P ${{ github.event.pull_request.number }}"
          fi
        elif [ "${{ github.event_name }}" = "issues" ]; then
          FLAGS+=" -I ${{ github.event.issue.number }}"
        elif [ "${{ github.event_name }}" = "schedule" ]; then
          FLAGS+=" --modules"
        else
          echo "Unknown event: ${{ github.event_name }}"
          exit 1
        fi
        python3 scripts/ci/set_assignees.py $FLAGS

    - name: Check maintainer file changes
      if: >
        github.event_name == 'pull_request_target' && github.base_ref == 'main'
      env:
        GITHUB_TOKEN: ${{ secrets.ZB_PR_ASSIGNER_GITHUB_TOKEN }}
      run: |
        python3 ./scripts/ci/check_maintainer_changes.py \
          --repo zephyrproject-rtos/${{ github.event.repository.name }} \
          MAINTAINERS.yml pr_MAINTAINERS.yml
